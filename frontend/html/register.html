<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · Rihla Airways</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">  

    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center gap-2 mb-2">
        <span class="ra-logo">✈</span>
        <h1 class="h3 mb-0 fw-bold">Rihla Airways</h1>
      </div>
      <p class="text-muted small mb-0">Create your passenger account</p>
    </div>

    <div class="card">
      <div class="card-body p-4">
        <h2 class="h5 mb-4">Register</h2>

        <div id="alert"></div>

        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label for="name" class="form-label small text-muted">FULL NAME</label>
            <input type="text" class="form-control" id="name"
                   placeholder="Safa Al-Balushi" required maxlength="100">
          </div>

          <div class="mb-3">
            <label for="email" class="form-label small text-muted">EMAIL ADDRESS</label>
            <input type="email" class="form-control" id="email"
                   placeholder="you@example.om" required maxlength="150">
          </div>

          <div class="mb-4">
            <label for="password" class="form-label small text-muted">PASSWORD</label>
            <input type="password" class="form-control" id="password"
                   placeholder="At least 8 characters" required minlength="8">
            <!-- 8 matches [MinLength(8)] on RegisterDto. saying it here
                 means the user finds out before submitting rather than
                 after a round trip -->
            <div class="form-text text-muted">Minimum 8 characters.</div>
          </div>

          <button type="submit" class="btn btn-primary w-100" id="submitBtn">
            Create Account
          </button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
          Already registered? <a href="login.html">Sign in</a>
        </p>
      </div>
    </div>

    <!-- worth saying out loud: AuthController hardcodes Role =
         "Passenger" on self-registration. if the client could choose,
         anyone could sign up as Admin -->
    <p class="text-center text-muted small mt-3 mb-0">
      New accounts are created as passengers.
    </p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>initRegister();</script>
</body>
</html>
