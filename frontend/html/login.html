<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Rihla Airways</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css?v=1786704245" rel="stylesheet">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">

    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center gap-2 mb-2">
        <span class="ra-logo">✈</span>
        <h1 class="h3 mb-0 fw-bold">Rihla Airways</h1>
      </div>
      <p class="text-muted small mb-0">Airline Booking &amp; Flight Management</p>
    </div>

    <div class="card">
      <div class="card-body p-4">
        <h2 class="h5 mb-4">Sign in</h2>

        <!-- api.js's showAlert() writes into this -->
        <div id="alert"></div>

        <!-- NOT a <form> with a submit handler by accident: the
             novalidate stops the browser's own validation bubbles
             so our server messages are the only thing the user
             sees. the form element itself is kept so Enter
             submits, which a bare div wouldn't do -->
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label small text-muted">EMAIL ADDRESS</label>
            <!-- generic placeholder on purpose. this used to be the real admin's
                 address, which handed anyone visiting the login page the exact
                 account worth attacking -->
            <input type="email" class="form-control" id="email"
                   placeholder="you@example.com" required autocomplete="email">
          </div>

          <div class="mb-4">
            <label for="password" class="form-label small text-muted">PASSWORD</label>
            <!-- the eye sits INSIDE the field via a relative wrapper, so the
                 input keeps its full width and the button doesn't reflow it -->
            <div class="pw-wrap">
              <input type="password" class="form-control" id="password"
                     placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="pw-toggle" id="pwToggle"
                      aria-label="Show password" aria-pressed="false">
                <svg class="pw-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="pw-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/>
                  <path d="M6.61 6.61A18.4 18.4 0 0 0 2 12s3.5 7 10 7a9 9 0 0 0 5.39-1.61"/>
                  <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                  <line x1="2" y1="2" x2="22" y2="22"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100" id="submitBtn">
            Sign In
          </button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
          No account? <a href="register.html">Register here</a>
        </p>
      </div>
    </div>

    <p class="text-center text-muted small mt-3 mb-0">
      Spark to Code 2026 · Capstone Project
    </p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js?v=1786704245"></script>
<script src="../js/auth.js?v=1786704245"></script>
<script>initLogin();</script>
</body>
</html>
