<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Rihla Airways</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">

    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center gap-2 mb-2">
        <span class="ra-logo">✈</span>
        <h1 class="h3 mb-0 fw-bold">Rihla Airways</h1>
      </div>
      <p class="text-muted small mb-0">Airline Booking &amp; Flight Management</p>
    </div>

    <div class="card">
      <div class="card-body p-4">
        <h2 class="h5 mb-4">Sign in</h2>

        <!-- api.js's showAlert() writes into this -->
        <div id="alert"></div>

        <!-- NOT a <form> with a submit handler by accident: the
             novalidate stops the browser's own validation bubbles
             so our server messages are the only thing the user
             sees. the form element itself is kept so Enter
             submits, which a bare div wouldn't do -->
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label small text-muted">EMAIL ADDRESS</label>
            <input type="email" class="form-control" id="email"
                   placeholder="safa@rihla.om" required autocomplete="email">
          </div>

          <div class="mb-4">
            <label for="password" class="form-label small text-muted">PASSWORD</label>
            <input type="password" class="form-control" id="password"
                   placeholder="••••••••" required autocomplete="current-password">
          </div>

          <button type="submit" class="btn btn-primary w-100" id="submitBtn">
            Sign In
          </button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
          No account? <a href="register.html">Register here</a>
        </p>
      </div>
    </div>

    <p class="text-center text-muted small mt-3 mb-0">
      JWT-protected · Spark to Code 2026 · Capstone Project
    </p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>initLogin();</script>
</body>
</html>
